# Modified for GPUI Design: focused workspace extracted from GPUI Kit v0.9.0.
[workspace]
members = ["crates/base", "crates/cli"]
default-members = ["crates/base", "crates/cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/andongmin94/gpui-design"
publish = false

[workspace.dependencies]
# Keep the engine family on the exact snapshot used by the source baseline.
gpui = { package = "gpui-pre", version = "=0.3.11" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.11", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
gpui_macros = { package = "gpui-pre-macros", version = "=0.3.11" }
sum-tree = { package = "gpui-pre-sum-tree", version = "=0.3.11" }

anyhow = "1"
instant = { version = "0.1", features = ["wasm-bindgen"] }
lsp-types = { version = "0.97.0", features = ["proposed"] }
raw-window-handle = "0.6.2"
ropey = { version = "=2.0.0-beta.1", features = ["metric_chars", "metric_lines_lf", "metric_utf16"] }
schemars = "1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1"
smallvec = "1"
tracing = "0.1.41"
windows = "0.58.0"

[workspace.lints.clippy]
almost_complete_range = "allow"
arc_with_non_send_sync = "allow"
borrowed_box = "allow"
dbg_macro = "deny"
let_underscore_future = "allow"
manual_is_multiple_of = "allow"
map_entry = "allow"
module_inception = "allow"
non_canonical_partial_ord_impl = "allow"
reversed_empty_ranges = "allow"
single_range_in_vec_init = "allow"
style = { level = "allow", priority = -1 }
todo = "deny"
type_complexity = "allow"
useless_conversion = "allow"

[profile.dev]
debug = "limited"
split-debuginfo = "unpacked"

[profile.release]
strip = "symbols"
