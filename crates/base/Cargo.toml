# Modified for GPUI Design: focused workspace extracted from GPUI Kit v0.9.0.
[package]
name = "gpui-design"
description = "Headless GPUI primitives with application-owned presentation."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
readme = "../../README.md"
keywords = ["gpui", "gui", "headless", "desktop"]

[lib]
doctest = false

[[example]]
name = "two_styles"
path = "examples/two_styles.rs"

[[test]]
name = "composition"
path = "tests/composition.rs"
required-features = ["test-support"]

[features]
test-support = ["gpui/test-support"]
inspector = ["gpui_macros/inspector", "gpui/inspector"]

[dependencies]
anyhow.workspace = true
aho-corasick = "1.1.3"
futures = "0.3"
gpui.workspace = true
gpui_macros.workspace = true
instant.workspace = true
lsp-types.workspace = true
ropey.workspace = true
regex = "1"
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
smallvec.workspace = true
sum-tree.workspace = true
tracing.workspace = true
unicode-linebreak = "0.1.5"
unicode-segmentation = "1.12.0"
web-time = "1"

[target.'cfg(target_os = "macos")'.dependencies]
raw-window-handle.workspace = true
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSAccessibility", "NSView", "NSWindow", "NSWorkspace"] }
objc2-foundation = { version = "0.3", features = ["NSGeometry", "NSString"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["async-io", "settings"] }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
gpui_platform.workspace = true
indoc = "2"

[lints]
workspace = true
